<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABH Ticketing Board</title>
<style>
:root {
  --navy:  #1B2A4A;
  --red:   #C0392B;
  --amber: #E67E22;
  --green: #27AE60;
  --blue:  #0E7CCE;
  --white: #FFFFFF;
  --ltgrey:#F5F5F5;
  --mdgrey:#CCCCCC;
  --dktext:#333333;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:13px;color:var(--dktext);background:#f0f2f5;min-height:100vh}

/* HEADER */
.header{background:var(--navy);color:var(--white);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:bold}
.header .subtitle{font-size:11px;opacity:.7;margin-top:2px}
.btn{padding:7px 14px;border:none;border-radius:4px;font-family:Arial,sans-serif;font-size:12px;font-weight:bold;cursor:pointer}
.btn-primary{background:var(--blue);color:var(--white)}
.btn-primary:hover{background:#0a6fb5}
.btn-danger{background:var(--red);color:var(--white)}
.btn-sm{padding:4px 10px;font-size:11px}

/* TOOLBAR */
.toolbar{background:var(--white);border-bottom:1px solid var(--mdgrey);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid var(--mdgrey);border-radius:4px;font-family:Arial,sans-serif;font-size:12px}
.view-toggle{display:flex;border:1px solid var(--mdgrey);border-radius:4px;overflow:hidden}
.view-toggle button{padding:6px 12px;border:none;background:var(--white);font-size:12px;cursor:pointer;font-family:Arial,sans-serif}
.view-toggle button.active{background:var(--navy);color:var(--white)}

/* SUMMARY TILES */
.tiles{display:flex;gap:10px;padding:14px 20px;flex-wrap:wrap}
.tile{background:var(--white);border-radius:6px;padding:12px 16px;min-width:130px;flex:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile .num{font-size:26px;font-weight:bold}
.tile .lbl{font-size:11px;color:#666;margin-top:2px}
.tile.open    .num{color:var(--blue)}
.tile.progress .num{color:var(--amber)}
.tile.hold    .num{color:#888}
.tile.signoff .num{color:var(--red)}
.tile.done    .num{color:var(--green)}

/* KANBAN */
.kanban{display:flex;gap:12px;padding:0 20px 20px;overflow-x:auto}
.col{background:var(--ltgrey);border-radius:6px;min-width:220px;flex:1;max-width:300px}
.col-header{padding:10px 12px;font-weight:bold;font-size:12px;border-radius:6px 6px 0 0;color:var(--white)}
.col-header.open    {background:var(--blue)}
.col-header.progress{background:var(--amber)}
.col-header.hold    {background:#888}
.col-header.signoff {background:var(--red)}
.col-header.done    {background:var(--green)}
.col-body{padding:8px;min-height:100px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--white);border-radius:4px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.07);cursor:pointer;border-left:3px solid var(--mdgrey)}
.card:hover{box-shadow:0 2px 6px rgba(0,0,0,.13)}
.card.critical{border-left-color:var(--red)}
.card.high    {border-left-color:var(--amber)}
.card.normal  {border-left-color:var(--blue)}
.card.low     {border-left-color:var(--mdgrey)}
.card-title{font-weight:bold;font-size:12px;margin-bottom:4px}
.card-meta{font-size:10px;color:#666;display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:bold;white-space:nowrap}
.badge-nike  {background:#e8f4fd;color:var(--blue)}
.badge-bob   {background:#fef9e7;color:#b7770d}
.badge-human {background:#eafaf1;color:#1e8449}
.badge-critical{background:#fdecea;color:var(--red)}
.badge-high  {background:#fef5e7;color:var(--amber)}
.badge-normal{background:#eaf4fd;color:var(--blue)}
.badge-low   {background:#f5f5f5;color:#888}
.badge-lane  {background:#f0eafb;color:#6c3483}
.due-soon{color:var(--red);font-weight:bold}

/* LIST VIEW */
.list-view{padding:0 20px 20px}
table.task-list{width:100%;border-collapse:collapse;background:var(--white);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
table.task-list th{background:var(--navy);color:var(--white);padding:8px 10px;font-size:11px;text-align:left;white-space:nowrap}
table.task-list td{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--ltgrey);vertical-align:top}
table.task-list tr:hover td{background:#f7f9fc;cursor:pointer}
.status-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold}
.status-open    {background:#e8f4fd;color:var(--blue)}
.status-in_progress{background:#fef5e7;color:var(--amber)}
.status-on_hold {background:#f5f5f5;color:#666}
.status-needs_signoff{background:#fdecea;color:var(--red)}
.status-complete{background:#eafaf1;color:var(--green)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:8px;width:680px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-header{background:var(--navy);color:var(--white);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:8px 8px 0 0}
.modal-header h2{font-size:15px}
.modal-close{background:none;border:none;color:var(--white);font-size:20px;cursor:pointer;line-height:1}
.modal-body{padding:18px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;font-weight:bold;color:#555;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:7px 10px;border:1px solid var(--mdgrey);border-radius:4px;font-family:Arial,sans-serif;font-size:12px}
.form-row textarea{min-height:70px;resize:vertical}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--ltgrey);display:flex;gap:8px;justify-content:flex-end}

/* DETAIL MODAL */
.detail-section{margin-bottom:16px}
.detail-section h3{font-size:12px;font-weight:bold;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;border-bottom:1px solid var(--ltgrey);padding-bottom:4px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-field label{font-size:10px;color:#888;font-weight:bold;text-transform:uppercase}
.detail-field p{font-size:12px;margin-top:2px}
.detail-field a{color:var(--blue);text-decoration:none}
.detail-field a:hover{text-decoration:underline}
.update-item{background:var(--ltgrey);border-radius:4px;padding:8px 10px;margin-bottom:6px}
.update-item .meta{font-size:10px;color:#888;margin-bottom:3px}
.update-input{display:flex;gap:8px;margin-top:8px}
.update-input input{flex:1;padding:7px 10px;border:1px solid var(--mdgrey);border-radius:4px;font-family:Arial,sans-serif;font-size:12px}

/* STATUS CHANGE BUTTONS */
.status-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.status-actions button{padding:5px 10px;border:1px solid var(--mdgrey);border-radius:4px;font-size:11px;cursor:pointer;background:var(--white);font-family:Arial,sans-serif}
.status-actions button:hover{background:var(--ltgrey)}
.status-actions button.current{font-weight:bold;background:var(--navy);color:var(--white);border-color:var(--navy)}

.empty{text-align:center;color:#aaa;font-size:12px;padding:20px}
#loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="h1" style="font-size:18px;font-weight:bold;color:#fff">ABH Ticketing Board</div>
    <div class="subtitle">Power source task tracker — Nike · Bob · Human</div>
  </div>
  <button class="btn btn-primary" onclick="openAddModal()">+ New Task</button>
</div>

<div class="toolbar">
  <select id="filterSource" onchange="render()">
    <option value="">All sources</option>
    <option value="Nike">Nike</option>
    <option value="Bob">Bob</option>
    <option value="Human">Human</option>
  </select>
  <select id="filterLane" onchange="render()">
    <option value="">All lanes</option>
    <option>Board packs</option>
    <option>Production</option>
    <option>Sales</option>
    <option>NetSuite</option>
    <option>Finance</option>
    <option>HR</option>
    <option>QC</option>
    <option>Learning &amp; Development</option>
    <option>Marketing</option>
    <option>Ops</option>
  </select>
  <select id="filterPriority" onchange="render()">
    <option value="">All priorities</option>
    <option value="critical">Critical</option>
    <option value="high">High</option>
    <option value="normal">Normal</option>
    <option value="low">Low</option>
  </select>
  <input id="filterSearch" type="text" placeholder="Search tasks..." oninput="render()" style="min-width:160px">
  <div class="view-toggle">
    <button id="btnKanban" class="active" onclick="setView('kanban')">Board</button>
    <button id="btnList" onclick="setView('list')">List</button>
  </div>
</div>

<div class="tiles" id="tiles"></div>

<div id="kanbanView">
  <div class="kanban" id="kanban"></div>
</div>
<div id="listView" style="display:none">
  <div class="list-view">
    <table class="task-list">
      <thead><tr>
        <th>Title</th><th>Source</th><th>Lane</th><th>Status</th><th>Priority</th><th>Due</th><th>Updated</th>
      </tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<div id="loading">Loading tasks...</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">New Task</h2>
      <button class="modal-close" onclick="closeAdd()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Task Title *</label>
        <input id="fTitle" placeholder="e.g. Build REG-016 Training Matrix">
      </div>
      <div class="form-row">
        <label>Goal / Description *</label>
        <textarea id="fGoal" placeholder="What needs to be achieved and why"></textarea>
      </div>
      <div class="form-2col">
        <div class="form-row">
          <label>Power Source *</label>
          <select id="fSource">
            <option value="Nike">Nike (Claude Code)</option>
            <option value="Bob">Bob (Grok / CoS)</option>
            <option value="Human">Human</option>
          </select>
        </div>
        <div class="form-row">
          <label>Assigned To (if Human)</label>
          <input id="fAssigned" placeholder="Name">
        </div>
      </div>
      <div class="form-2col">
        <div class="form-row">
          <label>Foundation Lane</label>
          <select id="fLane">
            <option value="">— select —</option>
            <option>Board packs</option>
            <option>Production</option>
            <option>Sales</option>
            <option>NetSuite</option>
            <option>Finance</option>
            <option>HR</option>
            <option>QC</option>
            <option>Learning &amp; Development</option>
            <option>Marketing</option>
            <option>Ops</option>
          </select>
        </div>
        <div class="form-row">
          <label>Priority</label>
          <select id="fPriority">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Foundation Trail Path (OneDrive)</label>
        <input id="fTrail" placeholder="e.g. ABH GROUP/Foundation/Production/_trail/2026-10-04.md">
      </div>
      <div class="form-2col">
        <div class="form-row">
          <label>GitHub Repo</label>
          <input id="fRepo" placeholder="rharris008/repo-name">
        </div>
        <div class="form-row">
          <label>Live URL</label>
          <input id="fUrl" placeholder="https://...">
        </div>
      </div>
      <div class="form-2col">
        <div class="form-row">
          <label>Status</label>
          <select id="fStatus">
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="on_hold">On Hold</option>
            <option value="needs_signoff">Needs Sign-off</option>
            <option value="complete">Complete</option>
          </select>
        </div>
        <div class="form-row">
          <label>Due Date</label>
          <input id="fDue" type="date">
        </div>
      </div>
      <div class="form-row">
        <label>SOP Links (one per line: Label | URL)</label>
        <textarea id="fSops" placeholder="Training SOP | https://...&#10;Brand Guidelines | https://..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="background:var(--ltgrey)" onclick="closeAdd()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-header" id="detailHeader">
      <h2 id="detailTitle">Task Detail</h2>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn" style="background:var(--ltgrey)" onclick="closeDetail()">Close</button>
      <button class="btn" style="background:var(--amber);color:#fff" onclick="editCurrentTask()">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCurrentTask()">Delete</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://gdfbpvzatnqmzujagtqm.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkZmJwdnphdG5xbXp1amFndHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMwOTMzNTQsImV4cCI6MjA1ODY2OTM1NH0.Bp0SFnKUJcDGqBCTcT8kKDkN7Iz3IplpFOkBdBknFvI';
const HDRS = {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation'};

let tasks = [], updates = [], currentView = 'kanban', editingId = null, currentDetailId = null;

const STATUSES = [
  {key:'open',       label:'Open',          cls:'open'},
  {key:'in_progress',label:'In Progress',   cls:'progress'},
  {key:'on_hold',    label:'On Hold',        cls:'hold'},
  {key:'needs_signoff',label:'Needs Sign-off',cls:'signoff'},
  {key:'complete',   label:'Complete',       cls:'done'},
];

async function api(method, path, body) {
  const r = await fetch(SUPA_URL + '/rest/v1/' + path, {
    method, headers: HDRS, body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

async function load() {
  document.getElementById('loading').style.display = 'block';
  [tasks, updates] = await Promise.all([
    api('GET', 'ai_tasks?order=created_at.desc&select=*'),
    api('GET', 'ai_task_updates?order=created_at.asc&select=*'),
  ]);
  document.getElementById('loading').style.display = 'none';
  render();
}

function getFiltered() {
  const src = document.getElementById('filterSource').value;
  const lane = document.getElementById('filterLane').value;
  const pri = document.getElementById('filterPriority').value;
  const q = document.getElementById('filterSearch').value.toLowerCase();
  return tasks.filter(t =>
    (!src  || t.power_source === src || (src === 'Human' && t.power_source.startsWith('Human'))) &&
    (!lane || t.foundation_lane === lane) &&
    (!pri  || t.priority === pri) &&
    (!q    || t.title.toLowerCase().includes(q) || (t.goal||'').toLowerCase().includes(q))
  );
}

function render() {
  const ft = getFiltered();
  renderTiles(ft);
  if (currentView === 'kanban') renderKanban(ft);
  else renderList(ft);
}

function renderTiles(ft) {
  const counts = {};
  STATUSES.forEach(s => counts[s.key] = 0);
  ft.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
  document.getElementById('tiles').innerHTML = STATUSES.map(s =>
    `<div class="tile ${s.cls}"><div class="num">${counts[s.key]}</div><div class="lbl">${s.label}</div></div>`
  ).join('');
}

function renderKanban(ft) {
  const cols = STATUSES.map(s => {
    const cards = ft.filter(t => t.status === s.key);
    return `<div class="col">
      <div class="col-header ${s.cls}">${s.label} <span style="opacity:.7">(${cards.length})</span></div>
      <div class="col-body">${cards.length ? cards.map(cardHtml).join('') : '<div class="empty">Empty</div>'}</div>
    </div>`;
  }).join('');
  document.getElementById('kanban').innerHTML = cols;
}

function cardHtml(t) {
  const srcBadge = sourceBadge(t.power_source);
  const priCls = t.priority || 'normal';
  const due = t.due_date ? dueLabel(t.due_date) : '';
  return `<div class="card ${priCls}" onclick="openDetail('${t.id}')">
    <div class="card-title">${esc(t.title)}</div>
    <div class="card-meta">
      ${srcBadge}
      ${t.foundation_lane ? `<span class="badge badge-lane">${esc(t.foundation_lane)}</span>` : ''}
      <span class="badge badge-${priCls}">${priCls}</span>
      ${due}
    </div>
  </div>`;
}

function renderList(ft) {
  document.getElementById('listBody').innerHTML = ft.length
    ? ft.map(t => `<tr onclick="openDetail('${t.id}')">
        <td><strong>${esc(t.title)}</strong><br><span style="color:#888;font-size:10px">${esc((t.goal||'').substring(0,80))}${(t.goal||'').length > 80 ? '…' : ''}</span></td>
        <td>${sourceBadge(t.power_source)}</td>
        <td>${t.foundation_lane ? `<span class="badge badge-lane">${esc(t.foundation_lane)}</span>` : '<span style="color:#aaa">—</span>'}</td>
        <td><span class="status-pill status-${t.status}">${statusLabel(t.status)}</span></td>
        <td><span class="badge badge-${t.priority||'normal'}">${t.priority||'normal'}</span></td>
        <td>${t.due_date ? `<span class="${isDueSoon(t.due_date) ? 'due-soon' : ''}">${fmtDate(t.due_date)}</span>` : '—'}</td>
        <td style="color:#888;font-size:11px">${fmtDateTime(t.updated_at)}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty">No tasks match filter</td></tr>';
}

function sourceBadge(src) {
  if (!src) return '';
  const cls = src.startsWith('Nike') ? 'nike' : src.startsWith('Bob') ? 'bob' : 'human';
  return `<span class="badge badge-${cls}">${esc(src)}</span>`;
}

function statusLabel(s) {
  return STATUSES.find(x => x.key === s)?.label || s;
}

function dueLabel(d) {
  const soon = isDueSoon(d);
  return `<span class="${soon ? 'due-soon' : ''}">${fmtDate(d)}</span>`;
}

function isDueSoon(d) {
  const days = (new Date(d) - new Date()) / 86400000;
  return days < 3;
}

function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function fmtDateTime(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setView(v) {
  currentView = v;
  document.getElementById('kanbanView').style.display = v === 'kanban' ? '' : 'none';
  document.getElementById('listView').style.display   = v === 'list'   ? '' : 'none';
  document.getElementById('btnKanban').className = v === 'kanban' ? 'active' : '';
  document.getElementById('btnList').className   = v === 'list'   ? 'active' : '';
  render();
}

// --- ADD / EDIT ---
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New Task';
  ['fTitle','fGoal','fAssigned','fTrail','fRepo','fUrl','fSops'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fSource').value = 'Nike';
  document.getElementById('fLane').value = '';
  document.getElementById('fPriority').value = 'normal';
  document.getElementById('fStatus').value = 'open';
  document.getElementById('fDue').value = '';
  document.getElementById('addOverlay').classList.add('open');
}

function closeAdd() { document.getElementById('addOverlay').classList.remove('open'); }

function editCurrentTask() {
  const t = tasks.find(x => x.id === currentDetailId);
  if (!t) return;
  closeDetail();
  editingId = t.id;
  document.getElementById('modalTitle').textContent = 'Edit Task';
  document.getElementById('fTitle').value = t.title || '';
  document.getElementById('fGoal').value = t.goal || '';
  document.getElementById('fSource').value = t.power_source || 'Nike';
  document.getElementById('fAssigned').value = '';
  document.getElementById('fLane').value = t.foundation_lane || '';
  document.getElementById('fPriority').value = t.priority || 'normal';
  document.getElementById('fStatus').value = t.status || 'open';
  document.getElementById('fTrail').value = t.foundation_trail_path || '';
  document.getElementById('fRepo').value = t.github_repo || '';
  document.getElementById('fUrl').value = t.live_url || '';
  document.getElementById('fDue').value = t.due_date || '';
  // parse sop_links back to text
  try {
    const sops = JSON.parse(t.sop_links || '[]');
    document.getElementById('fSops').value = sops.map(s => `${s.label} | ${s.url}`).join('\n');
  } catch { document.getElementById('fSops').value = ''; }
  document.getElementById('addOverlay').classList.add('open');
}

async function saveTask() {
  const title = document.getElementById('fTitle').value.trim();
  const goal  = document.getElementById('fGoal').value.trim();
  if (!title || !goal) { alert('Title and Goal are required.'); return; }
  const sopRaw = document.getElementById('fSops').value.trim();
  const sops = sopRaw ? sopRaw.split('\n').map(l => {
    const [label, ...rest] = l.split('|');
    return {label: label.trim(), url: rest.join('|').trim()};
  }).filter(s => s.url) : [];
  const body = {
    title,
    goal,
    power_source: document.getElementById('fSource').value,
    foundation_lane: document.getElementById('fLane').value || null,
    priority: document.getElementById('fPriority').value,
    status: document.getElementById('fStatus').value,
    foundation_trail_path: document.getElementById('fTrail').value.trim() || null,
    github_repo: document.getElementById('fRepo').value.trim() || null,
    live_url: document.getElementById('fUrl').value.trim() || null,
    due_date: document.getElementById('fDue').value || null,
    sop_links: sops.length ? JSON.stringify(sops) : null,
    updated_at: new Date().toISOString(),
  };
  if (editingId) {
    await api('PATCH', `ai_tasks?id=eq.${editingId}`, body);
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx >= 0) tasks[idx] = {...tasks[idx], ...body};
  } else {
    const [created] = await api('POST', 'ai_tasks', body);
    tasks.unshift(created);
  }
  closeAdd();
  render();
}

// --- DETAIL ---
async function openDetail(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  currentDetailId = id;
  const tUpdates = updates.filter(u => u.task_id === id);
  const hdr = document.getElementById('detailHeader');
  hdr.style.background = t.status === 'complete' ? 'var(--green)' : t.status === 'needs_signoff' ? 'var(--red)' : 'var(--navy)';
  document.getElementById('detailTitle').textContent = t.title;
  let sops = [];
  try { sops = JSON.parse(t.sop_links || '[]'); } catch {}
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-section">
      <h3>Goal</h3>
      <p style="font-size:13px;line-height:1.5">${esc(t.goal)}</p>
    </div>
    <div class="detail-section">
      <h3>Details</h3>
      <div class="detail-grid">
        <div class="detail-field"><label>Power Source</label><p>${sourceBadge(t.power_source)}</p></div>
        <div class="detail-field"><label>Status</label><p><span class="status-pill status-${t.status}">${statusLabel(t.status)}</span></p></div>
        <div class="detail-field"><label>Priority</label><p><span class="badge badge-${t.priority||'normal'}">${t.priority||'normal'}</span></p></div>
        <div class="detail-field"><label>Foundation Lane</label><p>${t.foundation_lane ? `<span class="badge badge-lane">${esc(t.foundation_lane)}</span>` : '—'}</p></div>
        <div class="detail-field"><label>Due Date</label><p>${t.due_date ? fmtDate(t.due_date) : '—'}</p></div>
        <div class="detail-field"><label>Created</label><p>${fmtDateTime(t.created_at)}</p></div>
        ${t.foundation_trail_path ? `<div class="detail-field" style="grid-column:1/-1"><label>Foundation Trail</label><p style="word-break:break-all;font-size:11px">${esc(t.foundation_trail_path)}</p></div>` : ''}
        ${t.github_repo ? `<div class="detail-field"><label>GitHub Repo</label><p><a href="https://github.com/${esc(t.github_repo)}" target="_blank">${esc(t.github_repo)}</a></p></div>` : ''}
        ${t.live_url ? `<div class="detail-field"><label>Live URL</label><p><a href="${esc(t.live_url)}" target="_blank">${esc(t.live_url)}</a></p></div>` : ''}
      </div>
    </div>
    ${sops.length ? `<div class="detail-section"><h3>SOP Links</h3>${sops.map(s => `<div style="margin-bottom:4px"><a href="${esc(s.url)}" target="_blank" style="color:var(--blue);font-size:12px">${esc(s.label)}</a></div>`).join('')}</div>` : ''}
    <div class="detail-section">
      <h3>Change Status</h3>
      <div class="status-actions">
        ${STATUSES.map(s => `<button class="${t.status === s.key ? 'current' : ''}" onclick="changeStatus('${id}','${s.key}')">${s.label}</button>`).join('')}
      </div>
    </div>
    <div class="detail-section">
      <h3>Progress Log (${tUpdates.length})</h3>
      <div id="updatesList">
        ${tUpdates.length ? tUpdates.map(u => `<div class="update-item">
          <div class="meta">${esc(u.engine)} — ${fmtDateTime(u.created_at)}</div>
          <div>${esc(u.note)}</div>
        </div>`).join('') : '<div class="empty">No updates yet</div>'}
      </div>
      <div class="update-input">
        <input id="newUpdateText" placeholder="Add progress note..." onkeydown="if(event.key==='Enter')addUpdate('${id}')">
        <select id="newUpdateEngine" style="padding:7px 8px;border:1px solid var(--mdgrey);border-radius:4px;font-size:12px">
          <option>Nike</option><option>Bob</option><option>Rob</option><option>Human</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="addUpdate('${id}')">Add</button>
      </div>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); currentDetailId = null; }

async function changeStatus(id, status) {
  await api('PATCH', `ai_tasks?id=eq.${id}`, {status, updated_at: new Date().toISOString()});
  const idx = tasks.findIndex(t => t.id === id);
  if (idx >= 0) tasks[idx].status = status;
  closeDetail();
  render();
}

async function addUpdate(taskId) {
  const note = document.getElementById('newUpdateText').value.trim();
  const engine = document.getElementById('newUpdateEngine').value;
  if (!note) return;
  const [u] = await api('POST', 'ai_task_updates', {task_id: taskId, engine, note});
  updates.push(u);
  document.getElementById('newUpdateText').value = '';
  // Refresh updates list in modal
  const tUpdates = updates.filter(x => x.task_id === taskId);
  document.getElementById('updatesList').innerHTML = tUpdates.map(u => `<div class="update-item">
    <div class="meta">${esc(u.engine)} — ${fmtDateTime(u.created_at)}</div>
    <div>${esc(u.note)}</div>
  </div>`).join('');
}

async function deleteCurrentTask() {
  if (!currentDetailId) return;
  if (!confirm('Delete this task? This cannot be undone.')) return;
  await api('DELETE', `ai_tasks?id=eq.${currentDetailId}`);
  tasks = tasks.filter(t => t.id !== currentDetailId);
  updates = updates.filter(u => u.task_id !== currentDetailId);
  closeDetail();
  render();
}

load();
</script>
</body>
</html>
